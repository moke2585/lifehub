# 本机 16GB 内存，保留足够堆避免 in-process Kotlin 编译触发守护进程 Metaspace 耗尽。
org.gradle.jvmargs=-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 工程位于含中文的路径下（E:\项目资料\__name__\lifehub）。AGP 默认会拒绝非 ASCII 路径，
# 这里显式放行；构建脚本与任务均未依赖路径编码。
android.overridePathCheck=true
# 本机用户名含中文，Kotlin 编译守护进程会把路径错误转义成 \uXXXX 并导致编译失败。
# 改为在 Gradle 进程内编译，避免该路径缺陷；CI（ASCII 路径）不受影响。
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
